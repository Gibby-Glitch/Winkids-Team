  --hero-bg:#1B1B1B; --hero-ink:#FFFFFF; --hero-muted:#A3A3A0; --hero-line:rgba(255,255,255,.1); --hero-track:rgba(255,255,255,.14);
  --tally:#3D3D3D;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.02rem;letter-spacing:-.005em}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem} .tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px} .stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--hero-bg);color:var(--hero-ink);border:1px solid var(--hero-line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;letter-spacing:.02em;flex:none;position:relative}
.mark::after{content:"";position:absolute;left:9px;right:9px;bottom:7px;height:3px;border-radius:2px;background:var(--accent)}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.2;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.78rem}
.acct{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:38px;height:38px;font-size:.8rem;font-weight:700;color:var(--brand-ink)}
.kids{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none;align-items:center}
.kids-label{flex:none;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.kid{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem}

main{padding-block:20px 140px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:40px;transition:background .15s,border-color .15s}

.list{display:flex;flex-direction:column}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}

.meter{height:8px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:999px}

.tally span.f{background:var(--tally);border-color:var(--tally)}
.tally span.me{background:var(--accent);border-color:var(--ink)}

/* practice option */
.opt{display:flex;flex-direction:column;gap:10px}
.opt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt-h{display:flex;gap:12px;align-items:flex-start}
.day{flex:none;width:54px;text-align:center;border-radius:10px;background:var(--surface-2);padding:7px 0}
.day b{font-family:var(--f-display);font-size:1.02rem;display:block;line-height:1.1}
.day small{font-size:.66rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.on .day{background:var(--accent);color:var(--on-accent)} .on .day small{color:var(--on-accent);opacity:.75}
details summary{cursor:pointer;color:var(--muted);font-size:.84rem;font-weight:600}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* meets timeline */
.month{font-family:var(--f-display);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.meet{display:flex;gap:12px}
.date{flex:none;width:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;padding:8px 2px;align-self:flex-start;overflow:hidden}
.date b{font-family:var(--f-display);font-size:1.2rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.date small{display:block;font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.date small:first-child{color:var(--brand-ink)}
.meet.closure .date{background:var(--surface-2)}
.meet.closure .date small:first-child{color:var(--muted)}
.meet.past{opacity:.55}
.fed{font-size:.68rem;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--muted)}
.fed.TAAF{background:var(--accent);color:var(--on-accent);border-color:transparent}
.fed.USAG{background:var(--usag-soft);color:var(--usag);border-color:var(--usag)}

/* shop */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:8px}

.size{border-radius:10px;background:var(--surface-2);padding:8px 10px}

.cartbar .wrap{padding-block:8px}
.cartbar button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--brand);color:var(--on-brand);border:0;border-radius:12px;padding:13px 18px;font-weight:700;box-shadow:var(--shadow)}

.fam{display:flex;flex-direction:column;gap:10px}
.fam-name{font-family:var(--f-display);font-size:1.02rem;font-weight:700}
.contact{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.9rem}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.copy{border:0;background:var(--surface-2);border-radius:6px;font-size:.72rem;padding:2px 7px;font-weight:600;color:var(--muted)}

const PK = { teams: ["code"], settings: ["key"], team_managers: ["email"], practice_signups: ["athlete_id","option_id"], meet_rsvps: ["athlete_id","meet_id"], holiday_responses: ["athlete_id","day_id"] };
const pkOf = t => PK[t] || ["id"];

function demoApi() {
  const db = buildDemo(); let email = PERSONAS[0].email;
  const isMgr = () => db.team_managers.some(m => m.email === email);
  const famId = () => (db.families.find(f => f.p1_email === email || f.p2_email === email) || {}).id || null;
  const owns = aid => db.athletes.some(a => a.id === aid && a.family_id === famId());
  const visible = (t, r) => {
    if (isMgr()) return true;
    if (["families"].includes(t)) return r.id === famId();
    if (t === "athletes") return r.family_id === famId();
    if (["practice_signups","meet_rsvps","holiday_responses"].includes(t)) return owns(r.athlete_id);
    if (t === "orders") return r.family_id === famId();
    if (t === "order_items") return db.orders.some(o => o.id === r.order_id && o.family_id === famId());
    if (t === "team_managers") return false;
    return famId() != null;
  };
  const clone = x => JSON.parse(JSON.stringify(x));
  const match = (r, m) => Object.keys(m).every(k => r[k] === m[k]);
  return {
    demo: true,
    persona: () => PERSONAS.find(p => p.email === email),
    setPersona(key) { email = PERSONAS.find(p => p.key === key).email; },
    async whoami() { return { email, isManager: isMgr(), familyId: famId() }; },
    async list(t) { return clone(db[t].filter(r => visible(t, r))); },
    async rpc(name) {
      if (!isMgr() && !famId()) return [];
      if (name === "practice_roster") return db.practice_signups.slice().sort(by("created_at")).map(s => { const a = db.athletes.find(x => x.id === s.athlete_id);
        return { option_id: s.option_id, athlete_id: s.athlete_id, display_name: `${a.first_name} ${a.last_name ? a.last_name[0] + "." : ""}`, team: a.team, waitlisted: s.waitlisted, created_at: s.created_at }; });
      if (name === "team_directory") return db.families.filter(f => f.show_in_directory).map(f => ({ family_id: f.id, ...f,
        athletes: db.athletes.filter(a => a.family_id === f.id && a.active).map(a => ({ first_name: a.first_name, last_name: a.last_name, team: a.team, level: a.level })) }));
      return [];
    },
    async insert(t, row) {
      row = clone(row);
      if (!isMgr()) {
        if (["practice_signups","meet_rsvps","holiday_responses"].includes(t) && !owns(row.athlete_id)) throw new Error("Not allowed");
        if (t === "orders" && row.family_id !== famId()) throw new Error("Not allowed");
        if (["families","athletes","teams","practice_options","meets","store_items","meet_packages","holiday_days","settings","team_managers"].includes(t)) throw new Error("Only the team manager can add this.");
      }
      if (pkOf(t)[0] === "id" && !row.id) row.id = uid();
      if (t === "practice_signups") { const o = db.practice_options.find(x => x.id === row.option_id);
        row.waitlisted = db.practice_signups.filter(s => s.option_id === row.option_id && !s.waitlisted).length >= o.capacity; row.created_at = new Date().toISOString(); }
      if (t === "orders") { row.status = row.status || "submitted"; row.created_at = new Date().toISOString(); row.total = 0; }
      if (t === "order_items") { const o = db.orders.find(x => x.id === row.order_id); const a = db.athletes.find(x => x.id === o.athlete_id); const it = db.store_items.find(x => x.id === row.item_id);
        if (it) { row.item_name = it.name; row.unit_price = it.level_prices?.[a?.level] ?? it.price; }
        db[t].push(row); o.total = db.order_items.filter(x => x.order_id === o.id).reduce((s, x) => s + (x.unit_price || 0) * x.qty, 0); return clone(row); }
      if (db[t].some(r => pkOf(t).every(k => r[k] === row[k]))) throw new Error("Already exists");
      db[t].push(row); return clone(row);
    },
    async upsert(t, row) {
      const ex = db[t].find(r => pkOf(t).every(k => r[k] === row[k]));
      if (ex) return this.update(t, Object.fromEntries(pkOf(t).map(k => [k, row[k]])), row);
      return this.insert(t, row);
    },
    async update(t, m, patch) {
      const r = db[t].find(x => match(x, m)); if (!r || !visible(t, r)) throw new Error("Not found");
      if (!isMgr() && !["families","athletes","meet_rsvps","holiday_responses"].includes(t)) throw new Error("Only the team manager can change this.");
      const p = { ...patch }; if (t === "athletes" && !isMgr()) { delete p.team; delete p.level; delete p.family_id; delete p.active; }
      Object.assign(r, p); return clone(r);
    },
    async remove(t, m) {
      const rows = db[t].filter(x => match(x, m) && visible(t, x));
      if (!isMgr() && !["practice_signups","meet_rsvps","holiday_responses"].includes(t)) throw new Error("Only the team manager can remove this.");
      rows.forEach(r => {
        db[t].splice(db[t].indexOf(r), 1);
        if (t === "practice_signups" && !r.waitlisted) { const nx = db.practice_signups.filter(s => s.option_id === r.option_id && s.waitlisted).sort(by("created_at"))[0]; if (nx) nx.waitlisted = false; }
      });
    },
    async signOut() {}
  };
}

    async signOut() { await sb.auth.signOut(); },

      return { email: s.user.email, isManager: !!r.is_manager, familyId: r.family_id || null }; },
    async list(t) { return chk(await sb.from(t).select("*")); },
    async rpc(n) { return chk(await sb.rpc(n)); },
    async insert(t, row) { const d = chk(await sb.from(t).insert(row).select()); return d[0]; },
    async upsert(t, row) { const d = chk(await sb.from(t).upsert(row, { onConflict: pkOf(t).join(",") }).select()); return d[0]; },
    async update(t, m, patch) { const d = chk(await sb.from(t).update(patch).match(m).select()); return d[0]; },
    async remove(t, m) { chk(await sb.from(t).delete().match(m)); }
  };
}

function waitPos(s) { return S.d.roster.filter(r => r.option_id === s.option_id && r.waitlisted).sort(by("created_at")).findIndex(r => r.athlete_id === s.athlete_id) + 1 || 1; }

function optCard(o, a, t) {

function timeline(list, a, showLv) {

}

function shForm(s) {
  const F = FORMS[s.table], key = pkOf(s.table)[0], row = s.id ? (S.d[s.table].find(r => String(r[key]) === String(s.id)) || {}) : (s.table === "athletes" ? { active: true } : s.table === "families" ? { show_in_directory: true, carpool: "none" } : s.table === "store_items" ? { active: true, allow_qty: true, category: "athlete" } : {});
  const f = F.fields(); const del = `del-${s.table}-${s.id}`;
  const field = ([k, l, t = "text", req, opts]) => {
    const v = row[k], id = "f-" + k, r = req ? "required" : "";
    if (t === "select") return sel(id, l, v, opts, req ? null : "—").replace(`<select id="${id}"`, `<select id="${id}" ${r}`);
    if (t === "multi") return `<div class="field"><label>${l}</label><div class="multi">${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<label><input type="checkbox" name="${id}" value="${esc(ov)}" ${(v || []).includes(ov) ? "checked" : ""}>${esc(ol)}</label>`; }).join("")}</div></div>`;
    if (t === "check") return `<label class="check"><input type="checkbox" name="${id}" ${v ? "checked" : ""}> ${l}</label>`;
    if (t === "textarea") return `<div class="field"><label for="${id}">${l}</label><textarea id="${id}" name="${id}" ${r}>${esc(v ?? "")}</textarea></div>`;
    if (t === "kv") return fld(id, l, v ? Object.entries(v).map(([a, b]) => `${a}=${b}`).join(", ") : "");
    return fld(id, l, v, t, `${r} ${t === "number" ? 'step="any"' : ""}`);
  };
  return { title: (s.id ? "Edit " : "Add ") + F.title.toLowerCase(), html: `<form class="stack" data-form="generic">
    ${s.table === "teams" && !s.id ? fld("f-code", "Short code (e.g. XS3)", "", "text", "required") : ""}
    ${s.table === "settings" ? `<div class="small muted">${esc(String(s.id).replace(/_/g, " "))}</div>` : ""}
    ${f.map(field).join("")}
    <div class="row"><button class="btn primary" type="submit">Save</button>${s.id && s.table !== "settings" ? `<button type="button" class="btn ${S.armed === del ? "armed" : "danger"}" data-act="fdel">${S.armed === del ? "Tap again to delete" : "Delete"}</button>` : ""}</div></form>` };
}

  if (what === "orders") { title = "Orders"; d.orders.forEach(o => d.order_items.filter(i => i.order_id === o.id).forEach(i => rows.push({ o, i, a: A(o.athlete_id), f: F(o.family_id) })));
    cols = [["date", r => r.o.created_at.slice(0, 10)], ["athlete", r => fullName(r.a)], ["team", r => team(r.a.team).name], ["parent", r => r.f.p1_name], ["item", r => r.i.item_name], ["choices", r => Object.entries(r.i.choices || {}).map(([k, v]) => `${k}: ${v}`).join("; ")], ["qty", r => r.i.qty], ["unit_price", r => r.i.unit_price], ["payment_plan", r => r.o.payment_plan], ["status", r => r.o.status], ["note", r => r.o.note]]; }

  openSheet({ type: "csv", title: title + " export", csv: toCSV(rows, cols), rows: rows.length, file: title.toLowerCase().replace(/\W+/g, "-") + ".csv", focus: false });
}

document.addEventListener("click", async e => {

      await act(async () => {

        await api.insert("practice_signups", { athlete_id: a.id, option_id: ds.opt });
      });
      const s = signupsOf(a.id).find(x => x.option_id === ds.opt); if (s) toast(s.waitlisted ? `Added to the waitlist (#${waitPos(s)})` : `${a.first_name} is signed up`);
      break; }
    case "unsign": if (!arm("rm-" + ds.opt)) return; await act(() => api.remove("practice_signups", { athlete_id: a.id, option_id: ds.opt }), "Removed"); break;

    case "form": openSheet({ type: "form", table: ds.table, id: ds.id, focus: false }); break;

    case "family": { const p = {}; ["p1_name","p1_email","p1_phone","p2_name","p2_email","p2_phone","city","carpool","carpool_note"].forEach(k => p[k] = nz(g(k)));

    case "sizes": { const p = { sizes_updated_at: new Date().toISOString() }; Object.keys(SIZE_FIELDS).forEach(k => { if (fd.has(k)) p[k] = nz(g(k)); }); ["chest","waist","hips","torso"].forEach(k => p[k] = g(k) === "" ? null : Number(g(k)));
      closeSheet(); await act(() => api.update("athletes", { id: a.id }, p), "Sizes saved"); break; }
    case "item": { const it = S.d.store_items.find(x => x.id === form.dataset.id), opts = parseOptions(it.options), choices = {};
